<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Contact Me</h1>

    <form>


        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <p>What are you interested in?</p>

        <input type="checkbox" id="programming" name="interest" value="programming">
        <label for="programming">Programming</label>

        <input type="checkbox" id="cybersecurity" name="interest" value="cybersecurity">
        <label for="cybersecurity">Cybersecurity</label>

        <input type="checkbox" id="web" name="interest" value="web">
        <label for="web">Web Development</label>

        <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="egypt">Egypt</option>
            <option value="saudi">Saudi Arabia</option>
            <option value="uae">UAE</option>
            <option value="uae">USA</option>
            <option value="other">Other</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <br>

        <input type="submit" value="Send">

    </form>

</body>
</html>
